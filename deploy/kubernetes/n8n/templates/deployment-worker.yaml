{{- if eq .Values.mode "queue" -}}
{{- $fullname := include "n8n.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-worker
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "n8n.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "n8n.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "n8n.podSpec" . | nindent 6 }}
      containers:
        {{- include "n8n.containers" (dict "root" . "component" "worker" "resources" .Values.worker.resources) | nindent 8 }}
      volumes:
        {{- include "n8n.volumes" (dict "root" . "component" "worker") | nindent 8 }}
{{- end }}
