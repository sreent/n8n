apiVersion: v1
kind: Service
metadata:
  name: {{ include "n8n.fullname" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "n8n.selectorLabels" (dict "root" . "component" "main") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: {{ include "n8n.httpPort" . }}
