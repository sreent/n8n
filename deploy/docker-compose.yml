# The sreent/n8n fork on one Linux server: n8n, its task runners, PostgreSQL, and Caddy for HTTPS.
# Read README.md in this folder first. The values come from .env (see .env.example).
name: n8n

services:
  postgres:
    # n8n supports PostgreSQL 17 and 18. Keep the major version: to change it, restore a backup.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep the data in a version folder below this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n -d n8n']
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: ${N8N_IMAGE:?Set N8N_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # n8n encrypts the credentials with this key. A restore needs the same key.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${DOMAIN:?Set DOMAIN in .env}
      N8N_PROTOCOL: https
      N8N_LISTEN_ADDRESS: 0.0.0.0
      WEBHOOK_URL: https://${DOMAIN}/
      # Caddy is the one proxy in front of n8n.
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      TZ: ${TIMEZONE:-UTC}
      # Keep files from workflows in PostgreSQL, so that one database backup holds all data.
      N8N_DEFAULT_BINARY_DATA_MODE: database
      N8N_GIT_SYNC_ALLOWED_HOSTS: ${GIT_SYNC_ALLOWED_HOSTS:-}
      # The features that the fork turns on without a licence: sharing, team projects, the project
      # roles, the admin role, custom roles, SSO, external secrets, variables, execution
      # annotations, evaluations, API key scopes, folders, debug in editor, insights, data
      # redaction, the custom span attributes of OpenTelemetry, node type policies, the personal
      # space policy, MFA enforcement, the diffs and the names of workflow versions, the private
      # registry of community nodes, token exchange, workflow reviews, the S3 and Azure Blob
      # storage, source control, Git connections, multiple main instances, the worker view, worker
      # pools, LDAP, dynamic credentials and the AI gateway. They are on unless .env turns them off.
      N8N_FORK_FEATURES_ENABLED: ${FORK_FEATURES_ENABLED:-true}
      # A banner on each page that tells that this instance is not for production.
      N8N_FORK_NON_PRODUCTION_BANNER: ${NON_PRODUCTION_BANNER:-false}
      # The hours that n8n keeps old workflow versions. -1 keeps all versions.
      N8N_WORKFLOW_HISTORY_PRUNE_TIME: ${WORKFLOW_HISTORY_PRUNE_TIME:--1}
      # SSRF protection: a node cannot call private, loopback or link-local addresses, also not the
      # metadata server of the cloud, until SSRF_ALLOWED_HOSTNAMES or SSRF_ALLOWED_IP_RANGES opens
      # the host. The AI nodes call the AI gateway of the fork on 127.0.0.1, so it stays open.
      N8N_SSRF_PROTECTION_ENABLED: ${SSRF_PROTECTION:-true}
      N8N_SSRF_ALLOWED_HOSTNAMES: ${SSRF_ALLOWED_HOSTNAMES:-}
      N8N_SSRF_ALLOWED_IP_RANGES: 127.0.0.1/32,${SSRF_ALLOWED_IP_RANGES:-}
      # A session lasts SESSION_HOURS. With SESSION_RENEWAL_HOURS -1, it does not renew: users sign
      # in again when it ends.
      N8N_USER_MANAGEMENT_JWT_DURATION_HOURS: ${SESSION_HOURS:-12}
      N8N_USER_MANAGEMENT_JWT_REFRESH_TIMEOUT_HOURS: ${SESSION_RENEWAL_HOURS:--1}
      # The security policy of Settings > Security & policies. At each start n8n sets these values,
      # and the page shows them read-only. SECURITY_POLICY_FROM_ENV=false gives the page back to the
      # admins.
      N8N_SECURITY_POLICY_MANAGED_BY_ENV: ${SECURITY_POLICY_FROM_ENV:-true}
      N8N_MFA_ENFORCED_ENABLED: ${MFA_ENFORCED:-true}
      N8N_PERSONAL_SPACE_PUBLISHING_ENABLED: ${PERSONAL_SPACE_PUBLISHING:-false}
      N8N_PERSONAL_SPACE_SHARING_ENABLED: ${PERSONAL_SPACE_SHARING:-false}
      N8N_WORKFLOW_REVIEWS_ENABLED: ${WORKFLOW_REVIEWS:-true}
      N8N_REDACTION_ENFORCEMENT_FLOOR: ${REDACTION_FLOOR:-off}
      # A new webhook, form, public chat or MCP server without authentication publishes only after
      # an approval in a workflow review. The published triggers keep running.
      N8N_OPEN_TRIGGERS_NEED_APPROVAL: ${OPEN_TRIGGERS_NEED_APPROVAL:-true}
      # The npm registry of community nodes, and its token. Empty values use the public registry.
      N8N_COMMUNITY_PACKAGES_REGISTRY: ${COMMUNITY_PACKAGES_REGISTRY:-https://registry.npmjs.org}
      N8N_COMMUNITY_PACKAGES_AUTH_TOKEN: ${COMMUNITY_PACKAGES_AUTH_TOKEN:-}
      # Node type policies and Git connections also need their modules, which upstream n8n does not
      # load by default. An empty ENABLED_MODULES in .env turns them off.
      N8N_ENABLED_MODULES: ${ENABLED_MODULES-type-availability-policies,promotions}
      # The editor of Git connections (Settings > Environments v2 and the banners of the projects).
      # Upstream n8n shows it only with this rollout flag.
      N8N_ENV_FEAT_PROMOTIONS: ${PROMOTIONS_EDITOR:-true}
      # The credential resolvers of dynamic credentials, the resolver setting of a workflow, the
      # hooks of the Webhook node and the Dynamic Credential Check node. Upstream n8n shows them
      # only with this rollout flag. The end-user credentials of each n8n user work without it.
      N8N_ENV_FEAT_DYNAMIC_CREDENTIALS: ${CREDENTIAL_RESOLVERS:-true}
      # The apps that call the endpoints of dynamic credentials: the origins that a browser can call
      # them from, and the token of a caller without a session. Empty values turn them off.
      N8N_DYNAMIC_CREDENTIALS_CORS_ORIGIN: ${DYNAMIC_CREDENTIALS_CORS_ORIGIN:-}
      N8N_DYNAMIC_CREDENTIALS_ENDPOINT_AUTH_TOKEN: ${DYNAMIC_CREDENTIALS_ENDPOINT_AUTH_TOKEN:-}
      # The Code nodes run in the runners container (external mode). n8n waits for the runners on
      # port 5679. Only the containers of this stack can reach that port, and they need the token.
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Set N8N_RUNNERS_AUTH_TOKEN in .env}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      # Only data that n8n can make again: the Git sync working copy and caches.
      - n8n-data:/home/node/.n8n

  runners:
    # Runs the JavaScript and Python code of the Code nodes, apart from n8n. The image must have the
    # same version as the n8n image.
    image: ${N8N_RUNNERS_IMAGE:?Set N8N_RUNNERS_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      # The default time zone of the JavaScript Code node, as in n8n.
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      # A runner without work for 15 seconds stops. The container starts it again for the next task.
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: 15

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      DOMAIN: ${DOMAIN}
      # The IP ranges that can call webhooks, chats and MCP servers, and the IP ranges that can open
      # and send forms, separated by spaces. The defaults let all addresses call them.
      WEBHOOK_ALLOWED_RANGES: ${WEBHOOK_ALLOWED_RANGES:-0.0.0.0/0 ::/0}
      FORM_ALLOWED_RANGES: ${FORM_ALLOWED_RANGES:-0.0.0.0/0 ::/0}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The HTTPS certificates. Caddy gets and renews them.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  n8n-data:
  caddy-data:
  caddy-config:
