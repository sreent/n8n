operationId: exportAuditLog
tags:
  - AuditLog
summary: Export audit events
description: 'Returns a file with all audit events that match the filter, newest first: a CSV file with the columns `timestamp`, `eventName`, `userId`, `userEmail` and `payload`, or a JSON array of events.'
x-required-scope: auditLogs:manage
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
      format: date-time
      description: Only the events at or after this time, in ISO 8601 with an offset.
      example: 2026-10-01T00:00:00.000Z
    required: false
    name: from
    in: query
  - schema:
      type: string
      format: date-time
      description: Only the events at or before this time, in ISO 8601 with an offset.
      example: 2026-10-31T23:59:59.999Z
    required: false
    name: to
    in: query
  - schema:
      type: string
      minLength: 1
      maxLength: 128
      description: An event name, or a prefix that ends with a dot.
      example: n8n.audit.workflow.
    required: false
    name: eventName
    in: query
  - schema:
      type: string
      minLength: 1
      maxLength: 36
      description: Only the events of this user.
      example: 6b2c7f4e-1a2b-4c3d-8e9f-0a1b2c3d4e5f
    required: false
    name: userId
    in: query
  - schema:
      type: string
      enum:
        - csv
        - json
      default: csv
      description: 'The format of the file: `csv` (the default) or `json`.'
    required: false
    name: format
    in: query
responses:
  '200':
    description: Operation successful.
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
